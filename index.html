<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0A0A0D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cinzel for Royal Gold Vibe & Plus Jakarta Sans for Modern 2026 Android UI -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lightblack: {
                            950: '#08080B', /* True OLED Cinema Deep */
                            900: '#0E0E13', /* Primary Surface */
                            800: '#15151C', /* Elevated Background */
                            700: '#1E1E27', /* Card Surface */
                            600: '#2A2A36'  /* Hover / Border */
                        },
                        gold: {
                            light: '#FFF3B0',
                            DEFAULT: '#D4AF37',
                            metallic: '#AA7C11',
                            shine: '#F3E5AB'
                        }
                    },
                    fontFamily: {
                        royal: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* ==================== 1. ANDROID WEBVIEW & 4K TV/PROJECTOR ADAPTIVE ROOT ==================== */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --rail-collapsed: 78px;
            --rail-expanded: 236px;
        }

        /* Proportional 10-Foot UI Scaling for Large Screens, 4K TVs & 300-inch Projectors (3840x2160 / 4096x2160) */
        html {
            height: 100%;
            overflow: hidden;
            font-size: 16px;
            background-color: #08080B;
            -webkit-tap-highlight-color: transparent;
        }

        @media (min-width: 1920px) {
            html { font-size: 18px; }
            :root { --rail-collapsed: 86px; --rail-expanded: 260px; }
        }

        @media (min-width: 2560px) {
            html { font-size: 22px; }
            :root { --rail-collapsed: 100px; --rail-expanded: 300px; }
        }

        @media (min-width: 3400px) {
            /* True 3840x2160 (UHD 4K) & 4096x2160 (DCI 4K) Projector Scale */
            html { font-size: 28px; }
            :root { --rail-collapsed: 120px; --rail-expanded: 360px; }
        }

        body {
            background-color: #08080B;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100%;
            height: 100dvh;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ==================== 2. 2026 LIQUID METALLIC GOLD DESIGN TOKENS ==================== */
        .gold-shine-text {
            background: linear-gradient(
                90deg,
                #BF953F 0%,
                #FCF6BA 25%,
                #D4AF37 50%,
                #FBF5B7 75%,
                #AA771C 100%
            );
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shineText 4.5s linear infinite;
        }

        .gold-shine-bg {
            background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 35%, #D4AF37 68%, #9A6B11 100%);
            background-size: 200% 200%;
            color: #08080B;
            font-weight: 800;
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.35);
            transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .gold-shine-bg:hover,
        .gold-shine-bg:focus-visible {
            background-position: right center;
            box-shadow: 0 8px 34px rgba(252, 246, 186, 0.55);
            transform: translateY(-2px) scale(1.02);
        }

        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.28);
        }

        .glass-surface {
            background: rgba(14, 14, 19, 0.78);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        @keyframes tabFadeIn {
            from { opacity: 0.25; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-fade-in {
            animation: tabFadeIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* ==================== 3. ANDROID TV / GOOGLE TV / PROJECTOR D-PAD FOCUS SYSTEM ==================== */
        .tv-focusable {
            outline: none;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.25s ease,
                        border-color 0.25s ease,
                        background-color 0.25s ease;
        }

        .tv-focusable:focus-visible,
        .tv-focusable.dpad-active {
            outline: none;
            border-color: #FCF6BA !important;
            box-shadow: 0 0 0 3px #FCF6BA, 0 12px 35px rgba(212, 175, 55, 0.45) !important;
            transform: scale(1.045);
            z-index: 30;
        }

        /* ==================== 4. ADAPTIVE NAVIGATION SHELL (MOBILE BOTTOM BAR <-> TV LEFT RAIL) ==================== */
        .webview-header {
            padding-top: calc(0.65rem + var(--safe-top));
            padding-left: calc(0.85rem + var(--safe-left));
            padding-right: calc(0.85rem + var(--safe-right));
        }

        .webview-footer {
            padding-bottom: calc(0.55rem + var(--safe-bottom));
            padding-left: calc(0.5rem + var(--safe-left));
            padding-right: calc(0.5rem + var(--safe-right));
        }

        /* Desktop / Android TV / Google TV / Projector Left Collapsible Navigation Rail (>= 1024px) */
        .tv-side-rail {
            width: var(--rail-collapsed);
            padding-top: calc(1rem + var(--safe-top));
            padding-bottom: calc(1rem + var(--safe-bottom));
            transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
        }

        .tv-side-rail:hover,
        .tv-side-rail:focus-within,
        .tv-side-rail.rail-expanded {
            width: var(--rail-expanded);
            background: linear-gradient(90deg, rgba(8, 8, 11, 0.98) 0%, rgba(14, 14, 19, 0.94) 80%, rgba(14, 14, 19, 0.8) 100%);
            box-shadow: 16px 0 48px rgba(0, 0, 0, 0.8);
        }

        .tv-side-rail .rail-text {
            opacity: 0;
            transform: translateX(-8px);
            white-space: nowrap;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
        }

        .tv-side-rail:hover .rail-text,
        .tv-side-rail:focus-within .rail-text,
        .tv-side-rail.rail-expanded .rail-text {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Active Navigation State (Both Mobile Pill Bar & TV Left Rail) */
        .nav-btn {
            position: relative;
            border-radius: 14px;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .nav-btn.active-nav {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.18), rgba(252, 246, 186, 0.06));
        }

        .mobile-nav-btn.active-nav::before {
            content: "";
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            border-radius: 9999px;
            background: linear-gradient(90deg, #BF953F, #FCF6BA, #AA771C);
            box-shadow: 0 0 12px rgba(252, 246, 186, 0.95);
        }

        .rail-nav-btn.active-nav::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3.5px;
            height: 60%;
            border-radius: 0 9999px 9999px 0;
            background: linear-gradient(180deg, #BF953F, #FCF6BA, #AA771C);
            box-shadow: 0 0 14px rgba(252, 246, 186, 0.95);
        }

        .nav-btn.active-nav .nav-icon-wrap {
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(252, 246, 186, 0.55);
        }

        .nav-btn.active-nav .nav-label {
            color: #FCF6BA !important;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.55);
        }

        /* ==================== 5. CINEMA POSTER CARDS & SHIMMER ==================== */
        .thumbnail-card {
            position: relative;
            overflow: hidden;
            scroll-snap-align: start;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.35s ease,
                        border-color 0.35s ease;
        }

        .thumbnail-card::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -70%;
            width: 45%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(252, 246, 186, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(28deg);
            transition: left 0.65s ease;
            pointer-events: none;
        }

        .thumbnail-card:hover::after,
        .thumbnail-card:focus-visible::after {
            left: 135%;
        }

        .thumbnail-card:hover {
            transform: translateY(-6px) scale(1.03);
            border-color: rgba(252, 246, 186, 0.8);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.75), 0 0 22px rgba(212, 175, 55, 0.28);
            z-index: 20;
        }

        /* Dedicated Smooth Scroll Area strictly inside App Shell */
        #mainScrollArea {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scroll-behavior: smooth;
        }

        /* Safe-Area Helpers for Overlays & Reels */
        .reel-safe-top { top: calc(1rem + var(--safe-top)); }
        .reel-safe-bottom { bottom: calc(1.5rem + var(--safe-bottom)); }
        .reel-actions-safe-bottom { bottom: calc(5rem + var(--safe-bottom)); }
        .toast-safe-top { top: calc(4.75rem + var(--safe-top)); }

        /* Custom Gold Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #BF953F, #FCF6BA, #AA771C);
            border-radius: 10px;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Crop YouTube Shorts Top Title & Bottom Logo to look 100% Native */
        .native-reel-iframe {
            position: absolute;
            top: -12%;
            left: -6%;
            width: 112%;
            height: 124%;
            border: 0;
            pointer-events: none;
        }

        /* Hero Unified 16:9 Widescreen Cinema Ratio (Same Height/Width Ratio on Phone, Laptop, TV & 300" Projector) */
        .hero-cinema-stage {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            max-height: 70vh;
        }
    </style>
</head>

        window.setAndroidSafeArea = function (topPx = 0, bottomPx = 0) {
            try {
                document.documentElement.style.setProperty("--safe-top", `${topPx}px`);

        /**
         * 4. SWITCH CATEGORY TAB (SYNCS BOTH MOBILE BOTTOM BAR & TV LEFT RAIL)
         */
        function switchCategoryTab(tabKey, shouldScrollTop = true) {
            try {
                const screenData = categoryScreensData[tabKey];
                if (!screenData) return;

                const reelModal = document.getElementById("reelPopupModal");
                if (reelModal && !reelModal.classList.contains("hidden")) {
                    closeReelPopup();
                }

                currentActiveTab = tabKey;

                // Sync Active State on both Mobile Bottom Nav and Desktop/TV Side Rail
                document.querySelectorAll(".nav-btn[data-tab]").forEach((btn) => {
                    if (btn.getAttribute("data-tab") === tabKey) {
                        btn.classList.add("active-nav");
                    } else {
                        btn.classList.remove("active-nav");
                    }
                });

                const pillEl = document.getElementById("activeCategoryPill");
                if (pillEl) pillEl.textContent = screenData.label;

                // Update Hero 4K Cinema Stage (Null-safe so missing hero text tags never break card rendering)
                const hero = screenData.hero;
                const video = document.getElementById("heroVideo");
                const source = document.getElementById("heroVideoSource");

                const heroBadgeEl = document.getElementById("heroBadge");
                if (heroBadgeEl) heroBadgeEl.textContent = hero.badge;

                const heroCategoryEl = document.getElementById("heroCategory");
                if (heroCategoryEl) heroCategoryEl.textContent = hero.category;

                const heroRatingEl = document.getElementById("heroRating");
                if (heroRatingEl) heroRatingEl.textContent = hero.rating || "9.8";

                const heroTitleEl = document.getElementById("heroTitle");
                if (heroTitleEl) heroTitleEl.textContent = hero.title;

                const heroDescEl = document.getElementById("heroDesc");
                if (heroDescEl) heroDescEl.textContent = hero.desc;

                const heroWatchNowLink = document.getElementById("heroWatchNowLink");
                if (heroWatchNowLink) heroWatchNowLink.setAttribute("href", hero.watchUrl);

                syncWatchlistButton(hero.title);

                if (video && source) {
                    video.poster = hero.posterUrl;
                    if (source.getAttribute("src") !== hero.videoUrl) {
                        source.setAttribute("src", hero.videoUrl);
                        video.load();
                    }
                    video.play().catch(() => {});
                }

                // Render Content Rails
                renderSections(screenData.sections);

                // Smooth Transition
                const mainEl = document.getElementById("home");
                if (mainEl) {
                    mainEl.classList.remove("tab-fade-in");
                    void mainEl.offsetWidth;
                    mainEl.classList.add("tab-fade-in");
                }

                if (shouldScrollTop) {
                    scrollMainToTop();
                }
            } catch (error) {
                console.error("Error switching category screen:", error);
            }
        }

        function scrollRailHorizontal(railId, direction) {
            const rail = document.getElementById(railId);
            if (!rail) return;
            const step = Math.max(rail.clientWidth * 0.72, 240);
            const maxScroll = rail.scrollWidth - rail.clientWidth;

            if (direction > 0 && rail.scrollLeft >= maxScroll - 8) {
                rail.scrollTo({ left: 0, behavior: "smooth" });
            } else if (direction < 0 && rail.scrollLeft <= 8) {
                rail.scrollTo({ left: maxScroll, behavior: "smooth" });
            } else {
                rail.scrollBy({ left: direction * step, behavior: "smooth" });
            }
        }

        /**
         * 7. HERO CONTROLS (AUDIO TOGGLE & MY LIST)
         */
        function toggleHeroAudio() {
            const video = document.getElementById("heroVideo");
            const icon = document.getElementById("heroAudioIcon");
            if (!video || !icon) return;
            video.muted = !video.muted;
            icon.className = `fa-solid ${video.muted ? "fa-volume-xmark" : "fa-volume-high"} text-sm sm:text-base`;
            showToast(video.muted ? "Preview Audio Muted" : "4K Preview Sound On");
        }

        function toggleHeroWatchlist() {
            const titleEl = document.getElementById("heroTitle");
            const fallbackTitle = categoryScreensData[currentActiveTab]?.hero?.title || "Show";
            const title = titleEl ? titleEl.textContent.trim() : fallbackTitle;
            if (watchlistSet.has(title)) {
                watchlistSet.delete(title);
                showToast(`Removed "${title}" from My List`);
            } else {
                watchlistSet.add(title);
                showToast(`Added "${title}" to My List`);
            }
            syncWatchlistButton(title);
        }

        function syncWatchlistButton(title) {
            const icon = document.getElementById("heroWatchlistIcon");
            const text = document.getElementById("heroWatchlistText");
            if (!icon || !text) return;
            const added = watchlistSet.has(title);
            icon.className = `fa-solid ${added ? "fa-check text-emerald-400" : "fa-plus text-gold"}`;
            text.textContent = added ? "In My List" : "My List";
        }

        /**
         * 8. UNIVERSAL SEARCH MODAL (SEARCH ACROSS ALL 4 CATEGORIES)
         */
        function getAllCatalogShows() {
            const seen = new Set();
            const all = [];
            Object.values(categoryScreensData).forEach((cat) => {
                cat.sections.forEach((sec) => {
                    sec.shows.forEach((show) => {
                        if (!seen.has(show.title)) {
                            seen.add(show.title);
                            all.push(show);
                        }
                    });
                });
            });
            return all;
        }

        function openSearchModal() {
            const modal = document.getElementById("searchModal");
            const input = document.getElementById("globalSearchInput");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
            runGlobalSearch(input.value || "");
            setTimeout(() => input.focus(), 60);
        }

        function closeSearchModal() {
            const modal = document.getElementById("searchModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function clearGlobalSearch() {
            const input = document.getElementById("globalSearchInput");
            input.value = "";
            runGlobalSearch("");
            input.focus();
        }

        function runGlobalSearch(query) {
            const q = (query || "").trim().toLowerCase();
            const clearBtn = document.getElementById("clearSearchBtn");
            const heading = document.getElementById("searchResultHeading");
            const countEl = document.getElementById("searchResultCount");
            const grid = document.getElementById("searchResultsGrid");

            if (clearBtn) clearBtn.classList.toggle("hidden", q.length === 0);

            const allShows = getAllCatalogShows();
            const matches = q
                ? allShows.filter(s => s.title.toLowerCase().includes(q) || s.Category.toLowerCase().includes(q))
                : allShows.slice(0, 15);

            heading.textContent = q ? `Search Results for "${query}"` : "Popular 4K Catalog";
            countEl.textContent = `${matches.length} Titles`;

            if (matches.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full glass-pill rounded-2xl p-10 text-center">
                        <i class="fa-solid fa-magnifying-glass text-gold text-3xl mb-3"></i>
                        <p class="text-white font-bold">No 4K titles found for "${query}"</p>
                        <p class="text-white/55 text-xs mt-1">Try searching "Royal", "Sci-Fi", "Movie", or "Hots".</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = matches.map(show => `
                <a href="${show.pageUrl}" class="tv-focusable thumbnail-card group flex flex-col rounded-2xl overflow-hidden bg-lightblack-700 gold-border">
                    <div class="relative aspect-[3/4] w-full flex-shrink-0 overflow-hidden bg-lightblack-800">
                        <img src="${show.thumb}" alt="${show.title}" loading="lazy" onerror="this.src='https://placehold.co/600x800/15151C/D4AF37?text=4K+SHOW'" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">

                            <i class="fa-solid fa-star text-gold text-[8px]"></i>${show.rating}
                        </div>
                    </div>
                    <div class="p-2.5 bg-lightblack-800 border-t border-gold/25">
                        <h4 class="text-xs font-bold text-white truncate uppercase">${show.title}</h4>
                        <p class="text-[10px] text-white/55 truncate mt-0.5">${show.Category}</p>
                    </div>
                </a>
            `).join("");
        }

        /**
         * 9. ANDROID TV / PROJECTOR D-PAD SPATIAL NAVIGATION ENGINE
         * Supports ArrowUp, ArrowDown, ArrowLeft, ArrowRight, Enter, and Escape/Back
         * for Google TV remotes, Android Projector remotes & keyboards.
         */
        document.addEventListener("keydown", function (e) {
            const reelModal = document.getElementById("reelPopupModal");
            const searchModal = document.getElementById("searchModal");
            const vipModal = document.getElementById("vipModal");

            // ESCAPE / ANDROID TV BACK
            if (e.key === "Escape") {
                if (window.handleAndroidBack()) {
                    e.preventDefault();
                    return;
                }
                // On TV/Desktop, Escape jumps focus back to Left Navigation Rail
                const railFirst = document.querySelector("#tvSideRail .nav-btn.active-nav");
                if (railFirst && window.innerWidth >= 1024) {
                    railFirst.focus();
                }
                return;
            }

            // Reel Popup Remote Arrow Up / Down
            if (reelModal && !reelModal.classList.contains("hidden")) {
                if (e.key === "ArrowDown") {
                    e.preventDefault();
                    scrollReelBy(1);
                } else if (e.key === "ArrowUp") {
                    e.preventDefault();
                    scrollReelBy(-1);
                }
                return;
            }

            // Do not hijack arrow keys while typing inside Search input
            if (document.activeElement && document.activeElement.tagName === "INPUT") {
                return;
            }

            if ((searchModal && !searchModal.classList.contains("hidden")) ||
                (vipModal && !vipModal.classList.contains("hidden"))) {
                return;
            }

            // Spatial Navigation for Main Stage & Left TV Rail
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
                handleTvSpatialNavigation(e);
            }
        });

        function handleTvSpatialNavigation(e) {
            const focusables = Array.from(document.querySelectorAll("body .tv-focusable")).filter(el => {
                if (!el.offsetParent) return false; // Skip hidden elements (e.g., mobile bar on desktop)
                const modalParent = el.closest("#searchModal, #reelPopupModal, #vipModal");
                return !modalParent;
            });

            if (focusables.length === 0) return;

            const current = document.activeElement;
            if (!current || !focusables.includes(current)) {
                e.preventDefault();
                const heroPlay = document.getElementById("heroWatchNowLink");
                (heroPlay || focusables[0]).focus();
                return;
            }

            const curRect = current.getBoundingClientRect();
            const curCx = curRect.left + curRect.width / 2;
            const curCy = curRect.top + curRect.height / 2;

            let bestCandidate = null;
            let bestScore = Infinity;

            focusables.forEach(candidate => {
                if (candidate === current) return;
                const r = candidate.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;

                const dx = cx - curCx;
                const dy = cy - curCy;

                let isDirectionMatch = false;
                let primaryDist = 0;
                let secondaryDist = 0;

                if (e.key === "ArrowRight" && dx > 12) {
                    isDirectionMatch = true;
                    primaryDist = dx;
                    secondaryDist = Math.abs(dy);
                } else if (e.key === "ArrowLeft" && dx < -12) {
                    isDirectionMatch = true;
                    primaryDist = Math.abs(dx);
                    secondaryDist = Math.abs(dy);
                } else if (e.key === "ArrowDown" && dy > 12) {
                    isDirectionMatch = true;
                    primaryDist = dy;
                    secondaryDist = Math.abs(dx);
                } else if (e.key === "ArrowUp" && dy < -12) {
                    isDirectionMatch = true;
                    primaryDist = Math.abs(dy);
                    secondaryDist = Math.abs(dx);
                }

                if (!isDirectionMatch) return;

                // Prioritize alignment along the intended axis (Google TV style D-Pad feel)
                const score = primaryDist + secondaryDist * 2.6;
                if (score < bestScore) {
                    bestScore = score;
                    bestCandidate = candidate;
                }
            });

            if (bestCandidate) {
                e.preventDefault();
                bestCandidate.focus({ preventScroll: true });
                bestCandidate.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
            }
        }

        /**
         * 10. VIP MODAL & TOAST HELPERS
         */
        function openVipModal() {
            const modal = document.getElementById("vipModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function closeVipModal() {
            const modal = document.getElementById("vipModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");
        }

        function activateVip() {
            closeVipModal();
            showToast("Crown VIP Activated! Enjoy 4096×2160 Streaming.");
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById("toastBox");
            const msgEl = document.getElementById("toastMessage");
            msgEl.textContent = message;
            toast.classList.remove("hidden");

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add("hidden");
            }, 3000);
        }

        /**
         * 11. NATIVE ZEENS PLAYER (YOUTUBE SHORTS AS NATIVE APP ZEENS)
         */
        const reelShortsData = [
            {
                ytUrl: "https://www.youtube.com/shorts/aqz-KE-bpKQ",
                title: "GOLDEN DYNASTY • OFFICIAL TEASER",
                caption: "Experience pure 4K cinema right inside ZEN G. #OriginalZEENS #4K",
                likes: "14.2K",
                pageUrl: "show-1.html"
            },
            {
                ytUrl: "https://www.youtube.com/shorts/YE7VzlLtp-4",
                title: "SHADOW OF THE CROWN • BEHIND THE SCENES",
                caption: "Exclusive sneak peek from our upcoming short film! #ShortFilm #Exclusive",
                likes: "9.8K",
                pageUrl: "show-2.html"
            },
            {
                ytUrl: "https://www.youtube.com/shorts/ScMzIvxBSi4",
                title: "CYBER GOLD 2099 • ACTION CLIP",
                caption: "Watch the full premiere movie only on ZEN G. #Movie #Action",
                likes: "22.5K",
                pageUrl: "movie-3.html"
            }
        ];

        let reelObserver = null;
        let isReelMuted = false;

        function extractYouTubeId(url) {
            if (!url) return "";
            const regex = /(?:youtube\.com\/(?:shorts\/|watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = url.match(regex);
            return match ? match[1] : url.trim();
        }

        function buildNativeReelEmbedUrl(videoId, muted) {
            const muteVal = muted ? 1 : 0;
            return `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=${muteVal}&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&disablekb=1&fs=0&playsinline=1&enablejsapi=1`;
        }

        function openReelPopup() {
            const heroVideo = document.getElementById("heroVideo");
            if (heroVideo && !heroVideo.paused) heroVideo.pause();

            const feed = document.getElementById("reelFeedContainer");
            feed.innerHTML = reelShortsData.map((reel, idx) => {
                const videoId = extractYouTubeId(reel.ytUrl);
                return `
                    <div class="reel-slide snap-start snap-always relative w-full h-[100dvh] sm:h-[88vh] bg-lightblack-900 overflow-hidden flex items-center justify-center" data-video-id="${videoId}" data-index="${idx}">
                        <iframe
                            id="reel-iframe-${idx}"
                            class="native-reel-iframe"
                            src=""
                            allow="autoplay; encrypted-media; picture-in-picture"
                            referrerpolicy="strict-origin-when-cross-origin"
                        ></iframe>

                        <div onclick="toggleReelMute(${idx})" class="absolute inset-0 z-10 cursor-pointer bg-gradient-to-t from-lightblack-950/90 via-transparent to-lightblack-950/50"></div>

                        <div class="reel-safe-top absolute left-4 z-20 flex items-center space-x-2 pointer-events-none">
                            <span class="gold-shine-bg text-[10px] px-2.5 py-1 rounded-full font-extrabold uppercase tracking-widest">
                                <i class="fa-solid fa-bolt mr-1"></i>ZEENS
                            </span>
                            <span class="text-white/90 text-xs font-bold tracking-wider drop-shadow">ZEN G</span>
                        </div>

                        <div class="reel-actions-safe-bottom absolute right-3 z-20 flex flex-col items-center space-y-5">
                            <button type="button" onclick="toggleReelLike(this)" class="flex flex-col items-center group focus:outline-none">
                                <div class="w-11 h-11 rounded-full bg-lightblack-900/75 backdrop-blur-md gold-border flex items-center justify-center text-white group-hover:scale-110 transition">
                                    <i class="fa-solid fa-heart text-lg"></i>
                                </div>
                                <span class="text-[11px] font-bold text-white mt-1 drop-shadow">${reel.likes}</span>
                            </button>

                            <button type="button" onclick="toggleReelMute(${idx})" class="reel-mute-btn flex flex-col items-center group focus:outline-none">
                                <div class="w-11 h-11 rounded-full bg-lightblack-900/75 backdrop-blur-md gold-border flex items-center justify-center text-gold group-hover:scale-110 transition">
                                    <i class="fa-solid ${isReelMuted ? 'fa-volume-xmark' : 'fa-volume-high'} text-lg"></i>
                                </div>
                                <span class="text-[10px] font-bold text-white mt-1 drop-shadow">${isReelMuted ? 'Muted' : 'Sound'}</span>
                            </button>

                            <button type="button" onclick="shareReel('${reel.title}')" class="flex flex-col items-center group focus:outline-none">
                                <div class="w-11 h-11 rounded-full bg-lightblack-900/75 backdrop-blur-md gold-border flex items-center justify-center text-white group-hover:scale-110 transition">
                                    <i class="fa-solid fa-share text-base"></i>
                                </div>
                                <span class="text-[10px] font-bold text-white mt-1 drop-shadow">Share</span>
                            </button>

                            <a href="${reel.pageUrl}" class="flex flex-col items-center group">
                                <div class="w-11 h-11 rounded-full gold-shine-bg flex items-center justify-center text-lightblack-950 group-hover:scale-110 transition shadow-lg">
                                    <i class="fa-solid fa-play text-sm ml-0.5"></i>
                                </div>
                                <span class="text-[10px] font-bold text-gold-light mt-1 drop-shadow">Full</span>
                            </a>
                        </div>

                        <div class="reel-safe-bottom absolute left-4 right-16 z-20 pointer-events-none">
                            <h4 class="font-royal text-sm sm:text-base font-extrabold gold-shine-text uppercase tracking-wide drop-shadow">
                                ${reel.title}
                            </h4>
                            <p class="text-white/85 text-xs mt-1 line-clamp-2 leading-relaxed drop-shadow">
                                ${reel.caption}
                            </p>
                        </div>
                    </div>
                `;
            }).join("");

            const modal = document.getElementById("reelPopupModal");
            modal.classList.remove("hidden");
            modal.classList.add("flex");

            setupReelObserver();
        }

        function setupReelObserver() {
            if (reelObserver) reelObserver.disconnect();
            const feed = document.getElementById("reelFeedContainer");
            const slides = feed.querySelectorAll(".reel-slide");

            reelObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const idx = entry.target.getAttribute("data-index");
                    const videoId = entry.target.getAttribute("data-video-id");
                    const iframe = document.getElementById(`reel-iframe-${idx}`);
                    if (!iframe) return;

                    if (entry.isIntersecting) {
                        const targetUrl = buildNativeReelEmbedUrl(videoId, isReelMuted);
                        if (iframe.src !== targetUrl) {
                            iframe.src = targetUrl;
                        }
                    } else {
                        iframe.src = "";
                    }
                });
            }, { root: feed, threshold: 0.65 });

            slides.forEach(slide => reelObserver.observe(slide));
        }

        function closeReelPopup() {
            if (reelObserver) reelObserver.disconnect();
            document.querySelectorAll("#reelFeedContainer iframe").forEach(iframe => {
                iframe.src = "";
            });

            const modal = document.getElementById("reelPopupModal");
            modal.classList.add("hidden");
            modal.classList.remove("flex");

            const heroVideo = document.getElementById("heroVideo");
            if (heroVideo && heroVideo.paused) heroVideo.play().catch(() => {});
        }

        function scrollReelBy(direction) {
            const feed = document.getElementById("reelFeedContainer");
            const slideHeight = feed.clientHeight;
            feed.scrollBy({ top: direction * slideHeight, behavior: "smooth" });
        }

        function toggleReelMute(idx) {
            isReelMuted = !isReelMuted;
            document.querySelectorAll(".reel-mute-btn").forEach(btn => {
                const icon = btn.querySelector("i");
                const label = btn.querySelector("span");
                icon.className = `fa-solid ${isReelMuted ? 'fa-volume-xmark' : 'fa-volume-high'} text-lg`;
                label.textContent = isReelMuted ? "Muted" : "Sound";
            });

            const iframe = document.getElementById(`reel-iframe-${idx}`);
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({
                    event: "command",
                    func: isReelMuted ? "mute" : "unMute",
                    args: ""
                }), "*");
            }
            showToast(isReelMuted ? "ZEENS Audio Muted" : "ZEENS Audio On");
        }

        function toggleReelLike(btn) {
            const icon = btn.querySelector("i");
            const isLiked = icon.classList.toggle("text-rose-500");
            if (isLiked) showToast("Added to Liked ZEENS!");
        }

        function shareReel(title) {
            try {
                const tempInput = document.createElement("input");
                tempInput.value = window.location.href;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast(`Link copied for "${title}"!`);
            } catch (e) {
                showToast(`Shared "${title}"!`);
            }
        }

        // ==================== APP INITIALIZATION ====================
        let isAppInitialized = false;
        function initOttApp() {
            if (isAppInitialized) return;
            isAppInitialized = true;
            switchCategoryTab("hots", false);
            updateSystemClock();
            setInterval(updateSystemClock, 15000);
        }

        document.addEventListener("DOMContentLoaded", initOttApp);
        window.addEventListener("load", initOttApp);
    </script>
